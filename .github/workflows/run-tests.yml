name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Gradle test
        run: gradle test --no-daemon

  perf-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run docker compose
        run: docker compose --env-file docker/test-env.properties -f docker/docker-compose.yaml up --abort-on-container-exit

      - name: Verify result artifacts
        run: test -f test-out/result-default.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perf-test-report
          path: |
            test-out/result-default.png
            test-out/result-default.metadata.json
