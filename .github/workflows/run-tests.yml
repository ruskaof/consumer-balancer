name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Gradle test
        run: gradle test --no-daemon

  perf-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run docker compose
        # --exit-code-from ties the run's pass/fail to the load-generator (and
        # implies --abort-on-container-exit), so a listener killed during teardown
        # cannot fail the job with a spurious non-zero exit code.
        run: docker compose --env-file docker/test-env.properties -f docker/docker-compose.yaml up --exit-code-from load-generator

      - name: Verify result artifacts
        run: |
          test -f test-out/result-default.png
          test -f test-out/result-default.shift.png
          test -f test-out/result-default.metadata.json

      - name: Upload artifacts
        # Always publish whatever was produced, even if the run or the verify
        # step failed, so the figures and metadata are available for debugging.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-test-report
          path: |
            test-out/result-default.png
            test-out/result-default.shift.png
            test-out/result-default.metadata.json
