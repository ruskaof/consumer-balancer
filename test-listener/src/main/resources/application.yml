spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      concurrency: ${LISTENER_CONCURRENCY:5}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:test-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        partition.assignment.strategy: ${KAFKA_ASSIGNMENT_STRATEGY:io.github.ruskaof.balancer.LoadAwarePartitionAssignor}

server:
  port: 4314

listener:
  # Simulated per-message service time. A fixed cost per record turns an
  # overloaded consumer (one assigned too much partition load) into observable
  # consumer lag and end-to-end latency. 0 disables it (no-op consume).
  processing-cost-micros: ${LISTENER_PROCESSING_COST_MICROS:0}

management:
  endpoint:
    prometheus:
      enabled: true
    metrics:
      enabled: true
    health:
      probes:
        enabled: true
  endpoints.web.exposure.include: health,prometheus

consumer-balancer:
  enabled: ${KAFKA_BALANCER_ENABLED:true}
  prometheus:
    weight-query-template: 'sum(rate(kafka_topic_partition_current_offset{topic=~"%s"}[1m])) by (topic, partition)'
    host: ${PROMETHEUS_HOST:localhost}
    port: ${PROMETHEUS_PORT:9090}