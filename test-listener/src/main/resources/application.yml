spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      concurrency: ${LISTENER_CONCURRENCY:5}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:test-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        partition.assignment.strategy: ${KAFKA_ASSIGNMENT_STRATEGY:io.github.ruskaof.balancer.LoadAwarePartitionAssignor}

server:
  port: 4314

management:
  endpoint:
    prometheus:
      enabled: true
    metrics:
      enabled: true
    health:
      probes:
        enabled: true
  endpoints.web.exposure.include: health,prometheus

# The default offset-rate weight store measures per-partition events/sec through the
# Kafka AdminClient, so no Prometheus (or kafka-exporter) is needed for weights.
consumer-balancer:
  enabled: ${KAFKA_BALANCER_ENABLED:true}
  # Library defaults; the perftest compose file tightens the reaction time because its load
  # shifts every 5 minutes, far faster than the drift the defaults are tuned for.
  rebalance-cooldown: ${REBALANCE_COOLDOWN:10m}
  rebalance-min-violated-checks: ${REBALANCE_MIN_VIOLATED_CHECKS:2}
  coordinator:
    trigger-check-interval: ${TRIGGER_CHECK_INTERVAL:30s}
  offset-rate:
    rate-interval: ${OFFSET_RATE_INTERVAL:1m}