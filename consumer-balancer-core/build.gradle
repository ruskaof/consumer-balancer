plugins {
    id 'java-library'
    id "com.vanniktech.maven.publish" version "0.36.0"
}

// Published module: no BOM/platform here — every dependency carries an explicit
// version so the released POM is self-contained and imposes no constraints on consumers.
dependencies {
    api libs.kafka.clients
    // Compile scope in the POM: ObjectMapper appears in the public API
    // (PrometheusClient's constructor, PrometheusObjectMappers.create()).
    api libs.jackson.databind
    implementation libs.slf4j.api
    testImplementation libs.mockito.core
    testRuntimeOnly libs.logback.classic
    testRuntimeOnly libs.junit.platform.launcher
}

mavenPublishing {
  coordinates(group, "consumer-balancer-core", version)

  pom {
    name = "Consumer Balancer Core"
    description = "A library for balancing Kafka partitions based on load."
    inceptionYear = "2026"
    url = "https://github.com/ruskaof/consumer-balancer"
    licenses {
      license {
        name = "The Apache License, Version 2.0"
        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
        distribution = "repo"
      }
    }
    developers {
      developer {
        id = "ruskaof"
        name = "Dmitrii Rusinov"
        url = "https://github.com/ruskaof"
      }
    }
    scm {
      url = "https://github.com/ruskaof/consumer-balancer"
    }
  }
}

