plugins {
    id 'java-library'
    id 'maven-publish'
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api project(':consumer-balancer-core')
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.slf4j:slf4j-api'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'Consumer Balancer Spring Boot Starter'
                description = 'Spring Boot auto-configuration for load-aware Kafka consumer partition assignment'
                url = 'https://github.com/ruskaof/consumer-balancer'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                developers {
                    developer {
                        id = 'ruskaof'
                        name = 'Dmitrii Rusinov'
                        email = 'ruskaof@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/ruskaof/consumer-balancer.git'
                    developerConnection = 'scm:git:ssh://github.com/ruskaof/consumer-balancer.git'
                    url = 'https://github.com/ruskaof/consumer-balancer'
                }
            }
        }
    }
}
