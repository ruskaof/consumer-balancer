plugins {
    id 'java-library'
    id "com.vanniktech.maven.publish" version "0.36.0"
}

// Published module: no BOM/platform here — every dependency carries an explicit
// version so the released POM is self-contained and imposes no constraints on consumers.
dependencies {
    api project(':consumer-balancer-core')
    // Compile scope in the POM: public classes implement/expose spring-boot-kafka and
    // spring-kafka types (DefaultKafkaConsumerFactoryCustomizer, KafkaListenerEndpointRegistry).
    api libs.spring.boot.kafka
    api libs.spring.kafka
    implementation libs.spring.boot.autoconfigure
    implementation libs.slf4j.api
    implementation libs.jackson.databind
    // Optional metrics integration: compileOnly keeps Micrometer out of the published POM;
    // meters bind only when the application brings micrometer-core itself (e.g. via actuator).
    compileOnly libs.micrometer.core
    annotationProcessor libs.spring.boot.configuration.processor
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.micrometer.core
    testRuntimeOnly libs.junit.platform.launcher
}

mavenPublishing {
  coordinates(group, "consumer-balancer-spring-boot-starter", version)

  pom {
    name = "Consumer Balancer Spring Boot Starter"
    description = "A library for balancing Kafka partitions based on load."
    inceptionYear = "2026"
    url = "https://github.com/ruskaof/consumer-balancer"
    licenses {
      license {
        name = "The Apache License, Version 2.0"
        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
        distribution = "repo"
      }
    }
    developers {
      developer {
        id = "ruskaof"
        name = "Dmitrii Rusinov"
        url = "https://github.com/ruskaof"
      }
    }
    scm {
      url = "https://github.com/ruskaof/consumer-balancer"
    }
  }
}
