plugins {
    id 'java-library'
    id "com.vanniktech.maven.publish" version "0.36.0"
}

version = project.findProperty("version")
group = project.findProperty("group")

dependencies {
    api project(':consumer-balancer-core')
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-kafka'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.slf4j:slf4j-api'
    implementation 'tools.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

mavenPublishing {
  coordinates(group, "consumer-balancer-spring-boot-starter", version)

  pom {
    name = "Consumer Balancer Spring Boot Starter"
    description = "A library for balancing Kafka partitions based on load."
    inceptionYear = "2026"
    url = "https://github.com/ruskaof/consumer-balancer"
    licenses {
      license {
        name = "The Apache License, Version 2.0"
        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
        distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
      }
    }
    developers {
      developer {
        id = "ruskaof"
        name = "Dmitrii Rusinov"
        url = "https://github.com/ruskaof"
      }
    }
    scm {
      url = "https://github.com/ruskaof/consumer-balancer"
    }
  }
}
