# CI / demo profile for the performance test.
#
# These values are tuned to run reasonably fast in CI while still exercising
# every code path and producing the figures + metadata artifact. For the
# values used to generate publishable results, see the "paper profile" in
# README.md (longer windows and more repetitions).
#
# Operating regime (see load_generator/config.py::regime):
#   consumer threads per group = CONSUMER_REPLICAS * LISTENER_CONCURRENCY = 8
#   thread capacity            = 1e6 / LISTENER_PROCESSING_COST_MICROS = 500 msg/s
#   aggregate capacity / group = 4000 msg/s
#   mean utilisation           = TARGET_TOTAL_MSGS_PER_SEC / 4000 = 0.35
# At ~35% mean utilisation, load-aware keeps every consumer below capacity while
# count-based assignors push the consumer holding the hot partitions over it.

# --- Topology ---------------------------------------------------------------
PARTITIONS_COUNT=32
CONSUMER_REPLICAS=4
LISTENER_CONCURRENCY=2
LISTENER_PROCESSING_COST_MICROS=2000

# --- Load and reproducibility ----------------------------------------------
TARGET_TOTAL_MSGS_PER_SEC=1400
SEED=42
LIBRARY_VERSION=1.0.0

# --- Experiments ------------------------------------------------------------
EXPERIMENT=AB

# Experiment A: static skew sweep.
# WARMUP_SECONDS must exceed the weight query's rate window ([1m] in
# application.yml) plus a coordinator trigger-check-interval (30s) so the
# proactive rebalance has acted on fresh weights before we measure.
SKEW_EXPONENTS=0.0,0.5,1.0
REPETITIONS=1
WARMUP_SECONDS=75
STEADY_SECONDS=30

# Experiment B: controlled load shift. Phases are long enough that fresh
# per-partition weights ([1m] rate) populate and the trigger can rebalance,
# so the recovery of the load-aware group is visible.
SHIFT_SKEW=0.7
SHIFT_PHASES=3
SHIFT_PHASE_SECONDS=90
