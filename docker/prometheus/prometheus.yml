global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "kafka"
    static_configs:
      - targets: [ "kafka-exporter:9308" ]
  - job_name: "listener-default"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
        - "docker-listener-default-1:4314"
        - "docker-listener-default-2:4314"
        - "docker-listener-default-3:4314"
        - "docker-listener-default-4:4314"
  - job_name: "listener-balanced"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "docker-listener-balanced-1:4314"
          - "docker-listener-balanced-2:4314"
          - "docker-listener-balanced-3:4314"
          - "docker-listener-balanced-4:4314"
