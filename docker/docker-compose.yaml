services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9091,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9091
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${PARTITIONS_COUNT}
    ports:
      - "9092:9092"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9091", "--describe"]

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
    volumes:
      - ./kui/config.yml:/etc/kafkaui/dynamic_config.yaml
    networks:
      - backend

  # Prometheus is only used by the load-generator to graph consumer metrics; the
  # balancer itself gets weights from Kafka end offsets via the AdminClient.
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend

  listener-roundrobin:
    build: ..
    environment:
      LISTENER_CONCURRENCY: ${LISTENER_CONCURRENCY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9091
      KAFKA_ASSIGNMENT_STRATEGY: org.apache.kafka.clients.consumer.RoundRobinAssignor
      KAFKA_CONSUMER_GROUP: listener-roundrobin
      KAFKA_BALANCER_ENABLED: false
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 4
    depends_on:
      kafka:
        condition: service_healthy

  listener-cooperative-sticky:
    build: ..
    environment:
      LISTENER_CONCURRENCY: ${LISTENER_CONCURRENCY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9091
      KAFKA_ASSIGNMENT_STRATEGY: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
      KAFKA_CONSUMER_GROUP: listener-cooperative-sticky
      KAFKA_BALANCER_ENABLED: false
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 4
    depends_on:
      kafka:
        condition: service_healthy

  listener-balanced:
    build: ..
    environment:
      LISTENER_CONCURRENCY: ${LISTENER_CONCURRENCY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9091
      KAFKA_ASSIGNMENT_STRATEGY: io.github.ruskaof.balancer.LoadAwarePartitionAssignor
      KAFKA_CONSUMER_GROUP: listener-balanced
      KAFKA_BALANCER_ENABLED: true
      # Experiment-sized reaction time, not a recommendation. The run is two 300s iterations
      # and moves the hotspot between them, so the whole detect-and-correct cycle has to fit
      # in a couple of minutes: the weight window must catch up to the new load (rate
      # interval), the imbalance must be confirmed (check interval x min-violated-checks),
      # and the correction must still be visible before the run ends (cooldown). The library
      # defaults are 1m/30s/10m — tuned for slow drift, where every fire is a stop-the-world
      # pause for the whole group.
      OFFSET_RATE_INTERVAL: 30s
      TRIGGER_CHECK_INTERVAL: 10s
      REBALANCE_COOLDOWN: 1m
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 4
    depends_on:
      kafka:
        condition: service_healthy

  load-generator:
    build: ../test-scripts/load-generator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9091
      TOPIC: test-topic
      PARTITIONS_COUNT: ${PARTITIONS_COUNT}
      GRAPH_OUTPUT_DIR: /test-out/result-default
      PROMETHEUS_URL: prometheus:9090
    volumes:
      - ../test-out:/test-out
    depends_on:
      - listener-roundrobin
      - listener-cooperative-sticky
      - listener-balanced
    networks:
      - backend

networks:
  backend:
