// group and version come from gradle.properties, the single source of truth for coordinates.
subprojects {
    repositories {
        mavenCentral()
    }

    plugins.withType(JavaPlugin) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        dependencies {
            compileOnly libs.lombok
            annotationProcessor libs.lombok
            testImplementation libs.junit.jupiter
        }

        test {
            useJUnitPlatform()
        }
    }
}
