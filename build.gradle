group = 'io.github.ruskaof'
version = '3.0.0'

subprojects {
    repositories {
        mavenCentral()
    }

    plugins.withType(JavaPlugin) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        dependencies {
            compileOnly libs.lombok
            annotationProcessor libs.lombok
            testImplementation libs.junit.jupiter
        }

        test {
            useJUnitPlatform()
        }
    }
}
